{% extends "base.html" %}
{% set title = "按池子分析 - 上传结果文件" %}

{% block content %}
  <div class="row justify-content-center">
    <div class="col-lg-8">
      <div class="card shadow-sm">
        <div class="card-body">
          <h5 class="card-title mb-2">上传池子汇总 Excel</h5>
          <p class="text-secondary mb-4">
            请上传 <code>result</code> 目录下由聚合脚本生成的 Excel 文件（如 <code>pool_hourly_summary.xlsx</code>）。每个 sheet 对应一个池子，上传后将识别所有池子供您选择并分析该池子下的用户异常。
          </p>

          <form action="{{ url_for('pool_upload') }}" method="post" enctype="multipart/form-data">
            <div class="mb-3">
              <label class="form-label">Excel 文件</label>
              <input class="form-control" type="file" name="file" accept=".xlsx,.xls" required>
              <div class="form-text">仅支持 <code>.xlsx</code> / <code>.xls</code>，且需包含多个 sheet（每个 sheet 为一个池子）。</div>
            </div>
            <button class="btn btn-primary btn-lg w-100" type="submit">上传并识别池子</button>
          </form>
        </div>
      </div>
      <div class="mt-3 text-center">
        <a href="{{ url_for('index') }}" class="text-secondary">返回首页（上传原始 CSV/Excel 检测）</a>
      </div>
    </div>
  </div>
{% endblock %}
